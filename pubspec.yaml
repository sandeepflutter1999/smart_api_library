name: smart_api
description: >
  Dynamic Dio wrapper for Flutter — auto raw/multipart detection, global
  loader/snackbar/toast hooks, session-expiry handling, and no-internet
  retry, no try/catch boilerplate.
version: 1.1.1
homepage: https://github.com/sandeepflutter1999/smart_api_library
repository: https://github.com/sandeepflutter1999/smart_api_library
issue_tracker: https://github.com/sandeepflutter1999/smart_api_library/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
